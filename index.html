<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cash Spending Tracker</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --primary: #3b6ef5;
    --primary-dark: #2a55d4;
    --danger: #e84545;
    --text: #1a1d23;
    --muted: #7a8099;
    --border: #e2e6ed;
    --green: #2dab6f;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }
  header {
    background: var(--card);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: var(--shadow);
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .header-btns { display: flex; gap: 8px; }
  button {
    border: none; cursor: pointer;
    font-family: inherit; font-size: 0.875rem; font-weight: 600;
    border-radius: 8px; padding: 8px 16px; transition: all 0.15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-outline {
    background: transparent; color: var(--primary);
    border: 1.5px solid var(--primary);
  }
  .btn-outline:hover { background: #eef1fd; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #c83535; }
  .btn-ghost { background: transparent; color: var(--muted); padding: 8px 12px; }
  .btn-ghost:hover { background: var(--border); }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

  /* List view */
  #list-view { padding: 16px; }
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.95rem; }

  .entry-card {
    background: var(--card); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: var(--shadow);
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .entry-info { flex: 1; min-width: 0; }
  .entry-desc { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-date { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .entry-amount { text-align: right; flex-shrink: 0; }
  .entry-amount .amt { font-weight: 700; font-size: 1rem; }
  .entry-amount .cur { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .entry-delete {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 6px; border-radius: 6px;
    font-size: 1rem; flex-shrink: 0;
    transition: color 0.15s, background 0.15s;
  }
  .entry-delete:hover { color: var(--danger); background: #fdeaea; }

  .group-header {
    font-size: 0.75rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 14px 4px 6px;
  }

  /* Summary bar */
  .summary-bar {
    background: var(--card); border-radius: var(--radius);
    padding: 12px 16px; margin-bottom: 16px;
    box-shadow: var(--shadow);
    display: flex; gap: 0; overflow-x: auto;
  }
  .summary-item { flex: 0 0 auto; padding: 0 14px; border-right: 1px solid var(--border); }
  .summary-item:first-child { padding-left: 0; }
  .summary-item:last-child { border-right: none; }
  .summary-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .summary-val { font-size: 1rem; font-weight: 700; margin-top: 2px; }

  /* Entry form */
  #form-view {
    display: none; padding: 16px;
  }
  .form-card {
    background: var(--card); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  .form-title { font-size: 1rem; font-weight: 700; margin-bottom: 18px; }
  .field { margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
  label { font-size: 0.8rem; font-weight: 600; color: var(--muted); width: 80px; flex-shrink: 0; text-align: right; }
  input, select {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.95rem; font-family: inherit;
    color: var(--text); background: var(--bg);
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); background: #fff; }
  .autocomplete-wrap { position: relative; }
  #ac-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow);
    max-height: 180px; overflow-y: auto; z-index: 20;
    display: none;
  }
  .ac-item {
    padding: 10px 14px; cursor: pointer; font-size: 0.9rem;
    transition: background 0.1s;
  }
  .ac-item:hover, .ac-item.active { background: #eef1fd; color: var(--primary); }
  .form-actions { display: flex; gap: 10px; margin-top: 20px; }
  .form-actions button { flex: 1; padding: 12px; font-size: 0.95rem; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #1a1d23; color: #fff; padding: 10px 20px;
    border-radius: 20px; font-size: 0.85rem; font-weight: 500;
    transition: transform 0.3s ease; z-index: 100; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  .no-scroll { overflow: hidden; }
</style>
</head>
<body>

<header>
  <h1>💵 Cash Tracker</h1>
  <div class="header-btns" id="list-header-btns">
    <button class="btn-outline btn-sm" id="export-btn">Export</button>
    <button class="btn-primary btn-sm" id="new-btn">+ New</button>
  </div>
  <div class="header-btns" id="form-header-btns" style="display:none">
    <button class="btn-ghost btn-sm" id="cancel-btn">Cancel</button>
    <button class="btn-primary btn-sm" id="save-btn">Save</button>
  </div>
</header>

<div id="list-view">
  <div id="summary-bar" class="summary-bar" style="display:none"></div>
  <div id="entries-list"></div>
</div>

<div id="form-view">
  <div class="form-card">
    <div class="field">
      <label for="f-date">Date</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label for="f-currency">Currency</label>
      <input type="text" id="f-currency" maxlength="3" placeholder="USD" style="text-transform:uppercase">
    </div>
    <div class="field">
      <label for="f-desc">Description</label>
      <div class="autocomplete-wrap">
        <input type="text" id="f-desc" placeholder="e.g. 7-Eleven" autocomplete="off">
        <div id="ac-list"></div>
      </div>
    </div>
    <div class="field">
      <label for="f-amount">Amount</label>
      <input type="text" id="f-amount" pattern="-?\d*\.?\d+" inputmode="decimal">
    </div>
    <div class="field">
      <label for="f-remark">Remark</label>
      <input type="text" id="f-remark" placeholder="Optional">
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORE_KEY    = 'cashtracker_entries';
const CURRENCY_KEY = 'cashtracker_currency';
const DESCRIPTION_KEY = 'cashtracker_descriptions'

// --- State ---
let entries = loadEntries();
let descriptions = loadDescriptions();
let acActive = -1;

// --- Storage ---
function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e) { return []; }
}
function saveEntries() {
  localStorage.setItem(STORE_KEY, JSON.stringify(entries));
}
function loadDescriptions(){
  try { return JSON.parse(localStorage.getItem(DESCRIPTION_KEY)) || []; }
  catch(e) { return []; }
}
function saveDescriptions() {
  localStorage.setItem(DESCRIPTION_KEY, JSON.stringify(descriptions));
}

// --- Helpers ---
function today() {
  return new Date().toLocaleDateString('en-CA');
}
function lastCurrency() {
  return localStorage.getItem(CURRENCY_KEY) || 'USD';
}
function uniqueDescriptions() {
  const seen = new Set();
  return descriptions.sort();
}
function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  return new Date(+y, +m - 1, +d).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}
function formatAmount(n) {
  return parseFloat(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// --- Views ---
function showList() {
  document.getElementById('list-view').style.display = '';
  document.getElementById('form-view').style.display = 'none';
  document.getElementById('list-header-btns').style.display = '';
  document.getElementById('form-header-btns').style.display = 'none';
  renderList();
}
function showForm() {
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('form-view').style.display = 'block';
  document.getElementById('list-header-btns').style.display = 'none';
  document.getElementById('form-header-btns').style.display = '';
  document.getElementById('f-date').value = today();
  document.getElementById('f-currency').value = lastCurrency();
  document.getElementById('f-desc').value = '';
  document.getElementById('f-amount').value = '';
  document.getElementById('f-remark').value = '';
  document.getElementById('f-desc').focus();
}

// --- Render ---
function renderList() {
  const el = document.getElementById('entries-list');
  const sb = document.getElementById('summary-bar');

  if (!entries.length) {
    sb.style.display = 'none';
    el.innerHTML = `<div class="empty-state"><div class="icon">🧾</div><p>No entries yet.<br>Tap <strong>+ New</strong> to add your first.</p></div>`;
    return;
  }

  // Summary
  const totals = {};
  entries.forEach(e => { totals[e.currency] = (totals[e.currency] || 0) + parseFloat(e.amount); });
  sb.style.display = 'flex';
  sb.innerHTML = Object.entries(totals).map(([cur, amt]) =>
    `<div class="summary-item"><div class="summary-label">${cur}</div><div class="summary-val">${formatAmount(amt)}</div></div>`
  ).join('') + `<div class="summary-item"><div class="summary-label">Entries</div><div class="summary-val">${entries.length}</div></div>`;

  // Group by date
  const groups = {};
  [...entries].reverse().forEach(e => {
    (groups[e.date] = groups[e.date] || []).push(e);
  });

  el.innerHTML = Object.entries(groups).map(([date, dayEntries]) => `
    <div class="group-header">${formatDate(date)}</div>
    ${dayEntries.map(e => `
      <div class="entry-card">
        <div class="entry-info">
          <div class="entry-desc">${e.description}</div>
          <div class="entry-date">${formatDate(e.date)}</div>
        </div>
        <div class="entry-amount">
          <div class="amt">${formatAmount(e.amount)}</div>
          <div class="cur">${e.currency}</div>
        </div>
        <button class="entry-delete" data-id="${e.id}" title="Delete">✕</button>
      </div>
    `).join('')}
  `).join('');

  el.querySelectorAll('.entry-delete').forEach(btn => {
    btn.addEventListener('click', () => deleteEntry(btn.dataset.id));
  });
}

// --- CRUD ---
function addEntry(date, currency, description, amount, remark) {
  entries.push({ id: Date.now().toString(), date, currency: currency.toUpperCase(), description, amount: parseFloat(amount), remark: remark || '' });
  if(!descriptions.includes(description)) {
    descriptions.push(description)
  }
  // Track last used currency to default new entries...
  localStorage.setItem(CURRENCY_KEY, currency.toUpperCase());
  saveEntries();
  // Save descriptions separately so they persist after exports...
  saveDescriptions();
}
function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  renderList();
  showToast('Entry deleted');
}

// --- Export ---
function exportCSV() {
  if (!entries.length) { showToast('Nothing to export'); return; }
  const rows = [['Date','Description','Amount','Currency','Remark']];
  entries.forEach(e => rows.push([e.date, `"${e.description.replace(/"/g,'""')}"`, e.amount, e.currency, `"${(e.remark||'').replace(/"/g,'""')}"`]));
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `spending_${today()}`;
  a.click();
  URL.revokeObjectURL(url);
  setTimeout(() => {
    entries = [];
    saveEntries();
    renderList();
    showToast('Exported & cleared ✓');
  }, 500);
}

// --- Autocomplete ---
const descInput = document.getElementById('f-desc');
const acList = document.getElementById('ac-list');

function showAC(val) {
  const all = uniqueDescriptions();
  const filtered = val ? all.filter(d => d.toLowerCase().includes(val.toLowerCase())) : all;
  acActive = -1;
  if (!filtered.length) { acList.style.display = 'none'; return; }
  acList.innerHTML = filtered.slice(0, 8).map((d, i) => `<div class="ac-item" data-i="${i}">${d}</div>`).join('');
  acList.style.display = 'block';
  acList.querySelectorAll('.ac-item').forEach(function(item) {
    item.addEventListener('mousedown', function(e) {
      e.preventDefault();
      descInput.value = item.textContent;
      acList.style.display = 'none';
    });
  });
}

descInput.addEventListener('input', function() { showAC(descInput.value); });
descInput.addEventListener('focus', function() { showAC(descInput.value); });
descInput.addEventListener('blur', function() { setTimeout(function() { acList.style.display = 'none'; }, 200); });
descInput.addEventListener('keydown', function(e) {
  const items = acList.querySelectorAll('.ac-item');
  if (!items.length || acList.style.display === 'none') return;
  if (e.key === 'ArrowDown') { e.preventDefault(); acActive = Math.min(acActive+1, items.length-1); items.forEach((it,i)=>it.classList.toggle('active',i===acActive)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acActive = Math.max(acActive-1, 0); items.forEach((it,i)=>it.classList.toggle('active',i===acActive)); }
  else if (e.key === 'Enter' && acActive >= 0) { e.preventDefault(); descInput.value = items[acActive].textContent; acList.style.display = 'none'; }
  else if (e.key === 'Escape') { acList.style.display = 'none'; }
});

// Currency uppercase
document.getElementById('f-currency').addEventListener('input', function() { this.value = this.value.toUpperCase(); });

// --- Save ---
document.getElementById('save-btn').addEventListener('click', () => {
  const date = document.getElementById('f-date').value;
  const currency = document.getElementById('f-currency').value.trim().toUpperCase();
  const desc = document.getElementById('f-desc').value.trim();
  const amount = document.getElementById('f-amount').value;

  const remark = document.getElementById('f-remark').value.trim();

  if (!date) { showToast('Please enter a date'); return; }
  if (!currency || currency.length !== 3) { showToast('Currency must be 3 letters'); return; }
  if (!desc) { showToast('Please enter a description'); return; }
  if (!amount || isNaN(amount)) { showToast('Please enter a valid amount'); return; }

  addEntry(date, currency, desc, amount, remark);
  showList();
  showToast('Entry saved ✓');
});

// --- Wire up buttons ---
document.getElementById('new-btn').addEventListener('click', showForm);
document.getElementById('cancel-btn').addEventListener('click', showList);
document.getElementById('export-btn').addEventListener('click', exportCSV);

// --- Init ---
showList();
</script>
</body>
</html>
